# ngrok tunnel publishing the task-status-gate at a fixed public address, so another
# workspace can load the task-status card. See system/apps/task_status/tunnel/README.md.
[program:task-status-tunnel]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user python3 system/scripts/with_secrets.py data/.secrets/status-tunnel.env -- bash system/apps/task_status/tunnel/run_tunnel.sh
directory=/home/user/workspace
# Set this to your own ngrok domain once you have created your own tunnel credential
# (see system/apps/task_status/tunnel/README.md); the free plan gives one per account.
# create_invite.py prints invites for the same address, so set it there too.
environment=STATUS_TUNNEL_DOMAIN="your-tunnel-domain.ngrok-free.dev"
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/task-status-tunnel-stdout.log
stderr_logfile=/var/log/supervisor/task-status-tunnel-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
