# Signature gate in front of the task-status app for visitors arriving over the
# task-status-tunnel. See system/apps/task_status/tunnel/README.md.
[program:task-status-gate]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user python3 system/apps/task_status/tunnel/gate.py
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/task-status-gate-stdout.log
stderr_logfile=/var/log/supervisor/task-status-gate-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
